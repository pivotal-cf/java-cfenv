name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { java: "17", boot: "" }
          - { java: "21", boot: "" }
          - { java: "17", boot: "4.0.+" }
          - { java: "17", boot: "4.1.+" }
          - { java: "17", boot: "4.2.+" }
    name: jdk-${{ matrix.java }}${{ matrix.boot && format('-boot-{0}', matrix.boot) || '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v2
        continue-on-error: true

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          cache-read-only: false

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace ${{ matrix.boot && format('-PspringBootVersion={0}', matrix.boot) || '' }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-java-${{ matrix.java }}-boot-${{ matrix.boot || 'default' }}
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**/*
          retention-days: 7

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-java-${{ matrix.java }}-boot-${{ matrix.boot || 'default' }}
          path: |
            **/build/reports/**/*
          retention-days: 7
