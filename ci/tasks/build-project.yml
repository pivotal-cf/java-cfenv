---
platform: linux

inputs:
  - name: git-repo
outputs:
  - name: distribution-repository
caches:
  - path: maven
  - path: gradle
run:
  path: git-repo/ci/scripts/build-project.sh
params:
  ARTIFACTORY_USERNAME: ((java-cfenv/broadcom-jfrog-artifactory/robot-account.username))
  ARTIFACTORY_PASSWORD: ((java-cfenv/broadcom-jfrog-artifactory/robot-account.password))
  ARTIFACTORY_VIRTUAL_REPO_URL: ((java-cfenv/artifactory-server.mirror))
